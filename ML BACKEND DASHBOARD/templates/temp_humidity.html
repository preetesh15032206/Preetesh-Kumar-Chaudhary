{% extends "base.html" %}

{% block content %}
<style>
    .chart-controls .btn { font-size: 0.72rem; padding: 0.3rem 0.85rem; font-weight: 700; letter-spacing: 0.02em; }
    .section-label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #64748b; }
    .stat-bar {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
        gap: 0.5rem;
        margin-bottom: 1rem;
    }
    .stat-item {
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.07);
        border-radius: 10px;
        padding: 0.6rem 0.85rem;
        display: flex; flex-direction: column; gap: 2px;
    }
    .stat-item-label { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #64748b; }
    .stat-item-value { font-size: 1.05rem; font-weight: 800; line-height: 1; }
</style>

<div class="container-fluid px-0" style="max-width: 1200px; margin: 0 auto;">
    <div class="glass-card p-3">

        <!-- Header row -->
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <div>
                <div class="fw-bold text-info" style="font-size: clamp(0.85rem, 2vw, 1rem); letter-spacing: 0.5px;">
                    ENVIRONMENTAL CORRELATION
                </div>
                <div class="section-label mt-1">Live Sensor Analytics — Temperature vs Humidity</div>
            </div>
            <div class="chart-controls btn-group shadow-sm">
                <button class="btn btn-sm btn-outline-info active">LINE</button>
                <button class="btn btn-sm btn-outline-info">AREA</button>
            </div>
        </div>

        <!-- Live stat chips -->
        <div class="stat-bar">
            <div class="stat-item">
                <span class="stat-item-label">🌡 Temp (Cur)</span>
                <span id="live-temp" class="stat-item-value" style="color: #f59e0b;">-- °C</span>
            </div>
            <div class="stat-item">
                <span class="stat-item-label">⬆ Temp High</span>
                <span id="live-temp-high" class="stat-item-value text-secondary">--</span>
            </div>
            <div class="stat-item">
                <span class="stat-item-label">⬇ Temp Low</span>
                <span id="live-temp-low" class="stat-item-value text-secondary">--</span>
            </div>
            <div class="stat-item">
                <span class="stat-item-label">💧 Hum (Cur)</span>
                <span id="live-hum" class="stat-item-value" style="color: #38bdf8;">-- %</span>
            </div>
            <div class="stat-item">
                <span class="stat-item-label">⬆ Hum High</span>
                <span id="live-hum-high" class="stat-item-value text-secondary">--</span>
            </div>
            <div class="stat-item">
                <span class="stat-item-label">⬇ Hum Low</span>
                <span id="live-hum-low" class="stat-item-value text-secondary">--</span>
            </div>
        </div>
        
        <!-- Correlation Insight -->
        <div class="mb-3 px-3 py-2 rounded d-flex align-items-center gap-2" style="background: rgba(6, 182, 212, 0.05); border: 1px solid rgba(6, 182, 212, 0.2);">
            <i class="bi bi-intersect text-info"></i>
            <span class="text-light fw-bold" style="font-size: 0.75rem; letter-spacing: 0.05em; color: #22d3ee;">SYSTEM CORRELATION:</span>
            <span id="live-correlation" class="text-secondary" style="font-size: 0.8rem;">Calculating inverse tracking parameters...</span>
        </div>

        <!-- Chart -->
        <div style="height: 320px;">
            <canvas id="dualChart"></canvas>
        </div>

    </div>
</div>

<script>
    let mainChart;
    let tempMin = null, tempMax = null, humMin = null, humMax = null;

    document.addEventListener('DOMContentLoaded', () => {
        const ctx = document.getElementById('dualChart').getContext('2d');
        const gradient1 = ctx.createLinearGradient(0, 0, 0, 320);
        gradient1.addColorStop(0, 'rgba(245,158,11,0.18)');
        gradient1.addColorStop(1, 'transparent');
        const gradient2 = ctx.createLinearGradient(0, 0, 0, 320);
        gradient2.addColorStop(0, 'rgba(59,130,246,0.18)');
        gradient2.addColorStop(1, 'transparent');

        mainChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: 'Temperature (°C)',
                        data: [], borderColor: '#f59e0b', backgroundColor: gradient1,
                        fill: true, yAxisID: 'y', tension: 0.4, borderWidth: 2.5,
                        pointRadius: (ctx) => ctx.dataIndex === ctx.dataset.data.length - 1 ? 5 : 0,
                        pointBackgroundColor: '#f59e0b',
                        pointBorderColor: '#fff',
                        pointBorderWidth: (ctx) => ctx.dataIndex === ctx.dataset.data.length - 1 ? 2 : 0,
                    },
                    {
                        label: 'Humidity (%)',
                        data: [], borderColor: '#3b82f6', backgroundColor: gradient2,
                        fill: true, yAxisID: 'y1', tension: 0.4, borderWidth: 2.5,
                        pointRadius: (ctx) => ctx.dataIndex === ctx.dataset.data.length - 1 ? 5 : 0,
                        pointBackgroundColor: '#3b82f6',
                        pointBorderColor: '#fff',
                        pointBorderWidth: (ctx) => ctx.dataIndex === ctx.dataset.data.length - 1 ? 2 : 0,
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                scales: {
                    x: {
                        grid: { display: false },
                        ticks: { color: '#64748b', maxRotation: 0, font: { size: 9 }, maxTicksLimit: 8 }
                    },
                    y: {
                        position: 'left',
                        grid: { color: 'rgba(255,255,255,0.05)' },
                        ticks: { color: '#f59e0b', font: { size: 10 } },
                        title: { display: true, text: 'Temp (°C)', color: '#f59e0b', font: { size: 10 } }
                    },
                    y1: {
                        position: 'right',
                        grid: { display: false },
                        ticks: { color: '#3b82f6', font: { size: 10 } },
                        title: { display: true, text: 'Hum (%)', color: '#3b82f6', font: { size: 10 } }
                    }
                },
                plugins: {
                    legend: {
                        labels: { color: '#cbd5e1', usePointStyle: true, boxWidth: 6, font: { size: 11 }, padding: 16 }
                    }
                }
            }
        });
    });

    window.onUpdate = function(d) {
        if (d.history.length > 0) {
            const temps = d.history.map(x => x.temperature).filter(v => v != null);
            const hums  = d.history.map(x => x.humidity).filter(v => v != null);

            mainChart.data.labels = d.history.map(x => x.timestamp);
            mainChart.data.datasets[0].data = d.history.map(x => x.temperature);
            mainChart.data.datasets[1].data = d.history.map(x => x.humidity);
            mainChart.update('none');

            // Update live stats
            document.getElementById('live-temp').textContent = d.current.temperature != null ? d.current.temperature + ' °C' : '-- °C';
            document.getElementById('live-hum').textContent  = d.current.humidity    != null ? d.current.humidity    + ' %'  : '-- %';

            if (temps.length) {
                const tMin = Math.min(...temps).toFixed(1);
                const tMax = Math.max(...temps).toFixed(1);
                document.getElementById('live-temp-low').textContent = tMin;
                document.getElementById('live-temp-high').textContent = tMax;
            }
            if (hums.length) {
                const hMin = Math.min(...hums).toFixed(1);
                const hMax = Math.max(...hums).toFixed(1);
                document.getElementById('live-hum-low').textContent = hMin;
                document.getElementById('live-hum-high').textContent = hMax;
            }
            
            if (temps.length && hums.length) {
                const corrEl = document.getElementById('live-correlation');
                // Calculate simple correlation coefficient
                let sumX = 0, sumY = 0, sumXY = 0, sumX2 = 0, sumY2 = 0;
                let n = Math.min(temps.length, hums.length);
                for(let i=0; i<n; i++) {
                    sumX += temps[i]; sumY += hums[i];
                    sumXY += temps[i]*hums[i];
                    sumX2 += temps[i]*temps[i]; sumY2 += hums[i]*hums[i];
                }
                const num = (n * sumXY) - (sumX * sumY);
                const den = Math.sqrt((n * sumX2 - sumX*sumX) * (n * sumY2 - sumY*sumY));
                let r = den === 0 ? 0 : num / den;
                
                if (r < -0.5) {
                    corrEl.innerHTML = `<span style="color:#a78bfa;">Humidity inversely tracking temperature — correlation: ${r.toFixed(2)}</span>`;
                } else if (r > 0.5) {
                    corrEl.innerHTML = `<span style="color:#a78bfa;">Humidity positively tracking temperature — correlation: ${r.toFixed(2)}</span>`;
                } else {
                    corrEl.innerHTML = `<span style="color:#94a3b8;">Weak correlation detected between temp and humidity (${r.toFixed(2)})</span>`;
                }
            }
        }
    };
</script>
{% endblock %}
